function home(){const n=news(),m=n[0],s=n.slice(1,3),pop=[...S.arts].sort((a,b)=>b.v-a.v).slice(0,5);
const sec=id=>{const l=n.filter(a=>a.cat==id).slice(0,4);return l.length?`<section class=sec><div class=sh><h2>${cn(id)}</h2></div><div class=grid>${l.map(card).join("")}</div></section>`:""};
return`<div class=w><div class=hero>${hero(m)}<div class=side>${s.map(hero).join("")}</div></div>
<div class=cols><section><div class=sh><h2>${t("all")}</h2></div>${n.slice(3).map(row).join("")}</section>
<aside><div class=box><div class=sh><h2>${t("read")}</h2></div><div class=pop>${pop.map(a=>`<a href="#n-${a.id}"><span>${$(ttl(a))}</span></a>`).join("")}</div></div><br>${adBox(250)}</aside></div>
${["national","intl"].map(sec).join("")}${adBox(110)}${["politics","economy","society","sport","culture","tech"].map(sec).join("")}
<section class=sec><div class=sh><h2>${t("ops")}</h2></div><div class=op>${ops().map(a=>`<a href="#n-${a.id}"><h3>${$(ttl(a))}</h3><span class=meta>${$(a.au)}</span></a>`).join("")}</div></section></div>`}
function listPage(title,l){return`<div class=w><section class=sec><div class=sh><h2>${title}</h2></div>${l.length?`<div class=grid>${l.map(card).join("")}</div>`:`<p>${t("none")}</p>`}</section></div>`}
function art(id){const a=S.arts.find(x=>x.id==id);if(!a)return listPage(t("none"),[]);const rel=S.arts.filter(x=>x.cat==a.cat&&x.id!=id).concat(news().filter(x=>x.cat!=a.cat)).slice(0,3),u=encodeURIComponent(ttl(a));
return`<div class=w><article class=art><span class=tag>${cn(a.cat)}</span><h1>${$(ttl(a))}</h1><div class=meta>${t("by")} ${$(a.au)} · ${fd(a.d)} · ${a.v.toLocaleString()} ${t("views")}</div>${pic(a)}${bd(a).split("\n").map(p=>`<p>${$(p)}</p>`).join("")}
<div class=sh2><b>${t("share")}:</b><a class="btn wa" target=_blank rel=noopener href="https://wa.me/?text=${u}">${t("wa")}</a><a class="btn fb" target=_blank rel=noopener href="https://www.facebook.com/sharer/sharer.php?u=">${t("fb")}</a></div>
<div class=sh><h2>${t("rel")}</h2></div><div class=grid style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${rel.map(card).join("")}</div></article></div>`}
function admin(r){if(!S.admin)return`<div class=w><form class="box login f" onsubmit="event.preventDefault();S.admin=true;LS('hm_adm',1);render()"><h2 style="margin:0;color:var(--red)">${t("login")}</h2><p class=meta>${t("demo")}</p><input placeholder="${t("user")}" value="admin"><input type=password placeholder="${t("pass")}" value="demo"><button class=btn>${t("login")}</button></form></div>`;
const tabs=[["news",t("news")],["add",t("add")],["cats",t("cats")]],v=S.arts.reduce((s,a)=>s+a.v,0);
let m="";
if(S.tab=="news")m=`<div class=st><div class=box><b>${news().length}</b>${t("stats")}</div><div class=box><b>${ops().length}</b>${t("arts")}</div><div class=box><b>${new Set(S.arts.map(a=>a.au)).size}</b>${t("jrn")}</div><div class=box><b>${v.toLocaleString()}</b>${t("vw")}</div></div><div class="box tw"><table><tr><th>${t("title")}</th><th>${t("cat")}</th><th>${t("date")}</th><th></th></tr>${S.arts.map(a=>`<tr><td>${$(ttl(a))}</td><td>${cn(a.cat)}</td><td>${a.d}</td><td style="white-space:nowrap"><button class="btn gh" onclick="ed('${a.id}')">${t("edit")}</button> <button class="btn dg" onclick="del('${a.id}')">${t("del")}</button></td></tr>`).join("")}</table></div>`;
if(S.tab=="add"){const a=S.edit?S.arts.find(x=>x.id==S.edit):null,L=a&&!a[S.lang]&&a.fr?"fr":S.lang;m=`<form class="box f" onsubmit="event.preventDefault();sv(this)"><h3 style="margin:0">${a?t("edit"):t("add")}</h3><label>${t("title")}<input name=ti required value="${a?$(a[L]||""):""}"></label><label>${t("cat")}<select name=ca>${S.cats.map(c=>`<option value=${c[0]} ${a&&a.cat==c[0]?"selected":""}>${S.lang=="ar"?c[1]:c[2]}</option>`).join("")}</select></label><label>${t("lang")}<select name=la><option value=ar ${L=="ar"?"selected":""}>العربية</option><option value=fr ${L=="fr"?"selected":""}>Français</option></select></label><label>${t("img")}<input type=file name=im accept="image/*"></label><label>${t("body")}<textarea name=bo rows=7 required>${a?$(L=="ar"?a.ba:a.bf):""}</textarea></label><button class=btn>${t("save")}</button></form>`}
if(S.tab=="cats")m=`<div class="box f"><div class=tw><table>${S.cats.map(c=>`<tr><td>${c[1]}</td><td>${c[2]}</td><td><button class="btn dg" onclick="dc('${c[0]}')">${t("del")}</button></td></tr>`).join("")}</table></div><form class=f onsubmit="event.preventDefault();ac(this)"><input name=a placeholder="${t("lbl")}" required><input name=f placeholder="${t("lblf")}" required><button class=btn>${t("add")}</button></form></div>`;
return`<div class="w ad-l"><aside>${tabs.map(x=>`<a class="${S.tab==x[0]?"on":""}" onclick="S.tab='${x[0]}';if(S.tab!='add')S.edit=null;render()">${x[1]}</a>`).join("")}<a href="#home">${t("site")}</a><a onclick="S.admin=false;LS('hm_adm',0);render()">${t("out")}</a></aside><main>${m}</main></div>`}
function setLang(){S.lang=S.lang=="ar"?"fr":"ar";LS("hm_lang",S.lang);render()}
function go(){S.q=document.getElementById("q").value.trim();location.hash="#s";render()}
function ed(id){S.edit=id;S.tab="add";render()}
function del(id){S.arts=S.arts.filter(a=>a.id!=id);save();toast(t("deleted"));render()}
function dc(id){S.cats=S.cats.filter(c=>c[0]!=id);save();render()}
function ac(f){S.cats.push(["c"+Date.now(),f.a.value,f.f.value,Math.floor(Math.random()*360)]);save();toast(t("saved"));render()}
